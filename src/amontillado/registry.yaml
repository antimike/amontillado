sources:
  builtin:
    kitty: {output: kitty.conf, complete: false, description: colour options; include from kitty.conf}
    gtk: {output: colors.css, complete: false, description: '@define-color per colour; @import from waybar, swaync, wlogout, gtk.css'}
    rofi: {output: colors.rasi, complete: false, description: 'a * { } block (roles hyphenated: on-accent)'}
    hyprland: {output: hyprland.lua, complete: false, description: 'a Lua table of "rrggbb", for dofile()'}
    hyprlock: {output: hyprlock.conf, complete: false, description: hyprlang $variables of rrggbb}
    sway: {output: sway, complete: false, description: set $variable per colour; include from the config}
    dunst: {output: dunst.conf, complete: true, description: 'a dunstrc.d drop-in: the urgency colours'}
    libadwaita: {output: libadwaita.css, complete: true, description: "libadwaita's named colours; gtk.css for GTK4 and GTK3 (adw-gtk3)"}
    libadwaita-vars: {output: libadwaita-vars.css, complete: true, description: "libadwaita's named colours, CSS variables and GNOME palette; gtk.css for GTK4 only"}
    nvim: {output: palette.lua, complete: false, description: 'a Lua table, for a lush spec'}
    shell: {output: colors.sh, complete: false, description: export AMO_BASE00=... ; source from a shell}
    json: {output: palette.json, complete: false, description: the palette as JSON}
