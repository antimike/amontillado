# amontillado's template registry (docs/design.md, "Theme engine (v0.2)", "Template sources").
#
# sources.<source>.<template>: one template. A template name defaults to the app's name, so
# `apps: {kitty: {source: tinted}}` takes sources.tinted.kitty. Per entry: the output file name
# in the profile, whether the result is a complete theme or variables only, and for a fetched
# source the repository, path, pinned commit and the file's sha256.
#
# Edit the entries by hand; `tools/registry.py --update` moves every repository's pin to its
# default branch's head and records each file's hash. Templates fetched by `amo theme sync` are
# not redistributed by amontillado (all three upstreams are MIT).
version: 1
repositories:
  tinted-theming/tinted-terminal: {commit: cd1785404c94d2d812d85da51010639e2fc86ca9}
  tinted-theming/base16-rofi: {commit: 307f0f898f176b779fa51a1b5b9c7ce79fa572d4}
  tinted-theming/base16-dunst: {commit: 32c9cec5a85d4d57857472c06437cc0e2c4a8166}
  tinted-theming/base16-waybar: {commit: a7bb37eacde16df4110e81444b99bec02d45dbda}
