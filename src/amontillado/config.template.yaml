# amontillado's config file, $XDG_CONFIG_HOME/amontillado/config.yaml. Written by
# `amo config init`; `amo config check` validates it. Every key is optional and
# commented out at its default or with an example: uncomment and change what you need.

# Library roots searched in addition to the default, $XDG_DATA_HOME/amontillado/library (where amo
# fetch and amo add put pictures). Absolute paths; ~ is expanded.
# library_roots: [~/Pictures/wallpapers]

# Where sketchy and nsfw pictures live, instead of $XDG_DATA_HOME/amontillado/library-nsfw. It may
# not be, contain or lie inside a library root (symlinks resolved), since a recursive search would
# then reach NSFW images.
# nsfw_root: ~/.local/share/amontillado/library-nsfw

# A command printing the Wallhaven API key on its first line, run by sh -c; WALLHAVEN_API_KEY wins
# over it. Needed for nsfw results. The key is never logged or written anywhere.
# api_key_command: pass show wallhaven/api-key

# amo crop --interactive: how it shows the picture and the box being placed.
crop:

  # auto (kitty in a terminal that speaks the kitty graphics protocol, found from KITTY_WINDOW_ID,
  # TERM or TERM_PROGRAM: kitty, ghostty, WezTerm; else viewer), kitty (drawn in the terminal) or
  # viewer (a preview file, rewritten after each key, shown by crop.viewer). kitty is immediate; a
  # viewer works anywhere but must reload a file that changes. Default: auto.
  # preview: auto

  # The image viewer for preview: viewer, started once by sh -c with AMO_FILE (the preview file) in
  # its environment; quote it ("$AMO_FILE"). It must reload the file when it changes (eog, gThumb
  # and Gwenview do; feh needs --reload; xdg-open opens whatever the desktop's default is).
  # viewer: 'xdg-open "$AMO_FILE"'

# amo edit: the editors it runs on a copy of a picture's file, by name (docs/design.md, "Editing").
edit:

  # The tool amo edit runs without --tool or --extcmd: a name under edit.tools. Unset: amo edit
  # needs one of those flags.
  # default_tool: gimp

  # Editors by name. A tool's cmd runs with sh -c in a fresh working directory inside the record
  # (.amo/edit-*), with AMO_INPUT (a copy of the file being edited), AMO_OUTPUT (where a result may
  # be written; it does not exist yet) and AMO_WORKDIR (that directory) added to your environment,
  # so a cmd can also read variables you set (STYLE=x amo edit ...). Quote them ("$AMO_INPUT"). It
  # must block until you are done: an editor that hands the file to a running instance and returns
  # finds nothing. The result is AMO_OUTPUT if it exists, else the one image in the working
  # directory (or below it) that is new or changed; files in the editor's own format (.xcf, .kra)
  # are ignored, so export into the folder the editor opens in.
  tools:
    # A tool's keys:
    #   cmd: The command line, run by sh -c.
    #   description: One line on what the tool is for, shown by amo edit --list-tools.
    #
    # -n starts a new GIMP: without it the file goes to a running one and gimp returns at once.
    # gimp:
    #   cmd: gimp -n "$AMO_INPUT"
    #   description: GIMP; File > Overwrite the copy, or Export As into its folder
    #
    # With Krita's 'Allow only one instance' setting on and Krita running, krita returns at once.
    # krita:
    #   cmd: krita "$AMO_INPUT"
    #   description: Krita; File > Export into its folder
    #
    # pinta:
    #   cmd: pinta "$AMO_INPUT"
    #   description: Pinta; save over the copy
    #
    # :memory: keeps the copy out of your darktable library and its lock.
    # darktable:
    #   cmd: 'darktable --library :memory: "$AMO_INPUT"'
    #   description: darktable's darkroom; export (to darktable_exported/ by default)
    #
    # darktable-cli:
    #   cmd: darktable-cli "$AMO_INPUT" "$AMO_OUTPUT" --style "${STYLE:?a darktable style}"
    #   description: a darktable style, no window; STYLE=<name> amo edit ...
    #
    # rawtherapee:
    #   cmd: rawtherapee "$AMO_INPUT"
    #   description: RawTherapee; Save current image into its folder
    #
    # Writes <name>.jpg into the working directory (over the copy if it is a JPEG); -n before -c
    # writes PNG.
    # rawtherapee-cli:
    #   cmd: rawtherapee-cli -Y -o "$AMO_WORKDIR" -p "${PROFILE:?a .pp3 file}" -c "$AMO_INPUT"
    #   description: a RawTherapee profile, no window; PROFILE=<file.pp3>; writes JPEG
    #
    # satty:
    #   cmd: satty -f "$AMO_INPUT" -o "$AMO_WORKDIR/annotated.png" --early-exit
    #   description: annotate, blur or redact; saving writes a PNG and closes it
    #
    # magick-modulate:
    #   cmd: magick "$AMO_INPUT" -modulate 100,"${SATURATION:-80}" "$AMO_OUTPUT"
    #   description: ImageMagick, no window; saturation to SATURATION% (default 80)
    #
    # inkscape:
    #   cmd: inkscape "$AMO_INPUT"
    #   description: Inkscape; Export as PNG into its folder (a vector editor, clumsy for bitmaps)

# A command run by sh -c after a command writes under a library root (amo index, fetch, add, crop,
# add-derived, edit, name), once per root it wrote to, with a JSON list of the changes on stdin:
# each info file's text before and after, new files, renames (docs/design.md, "git-annex libraries:
# decisions" 5). AMO_ROOT is the root, AMO_COMMAND the command. Its output goes to stderr. Unset:
# nothing runs; amo never runs git itself. amo hook git-commit commits the changes to a root that is
# a git repository, merging info files with amo info merge so your own uncommitted edits stay
# uncommitted. A failing hook is a warning; amo's writes stand.
# on_change: amo hook git-commit

# The theme engine: amo palette and amo theme (docs/design.md, "Theme engine (v0.2)").
theme:

  # Where profiles are rendered: <cache>/<profile>/ and the current link, which app configs include
  # from. Default $XDG_CACHE_HOME/theme.
  # cache: ~/.cache/theme

  # The profile amo theme apply writes: a name in the cache, not current and not starting with '.'.
  # A second profile keeps its own files (another monitor, a test theme) and is activated by
  # pointing current at it. Default: default.
  # profile: default

  # The program that makes a picture's palette (the neutral ramp and the accent): matugen or
  # wallust. Unset: the first installed, in that order. matugen gives both variants in one run and
  # Material's accents; wallust is the fallback without it.
  # generator: matugen

  # Who assigns base08-base0F (ANSI colours 1-6 and 9-14) of a picture's palette: amontillado (fixed
  # named hues, so red stays red, with chroma and lightness from the picture) or generator (its own
  # colours: matugen 4.2's are clustering, often off their hue or as dark as the background, so
  # contrast fixes cannot save them). Default: amontillado.
  # hues: amontillado

  # Which of the palette's variants is applied: auto (light when the picture's lightness is above
  # 0.65, else dark), dark, light, or system (the desktop's colour scheme, read at apply time from
  # the settings portal, else gsettings; auto with a warning when neither has a preference). An
  # app's own variant wins. A variant the palette lacks warns and the app gets the one it has;
  # nothing is inverted. Default: auto.
  # variant: auto

  # What happens to a colour pair below its WCAG contrast minimum: adjust (move the foreground, then
  # the accent as a last resort, in lightness; each change logged and listed under adjusted), report
  # (log the pair, change nothing) or off. adjust keeps text readable at the cost of colours a
  # little off the source's. Default: adjust.
  # contrast: adjust

  # The wallpaper hook.
  wallpaper:

    # A command run last after each apply, by sh -c with AMO_WALLPAPER (the picture; unset, and the
    # command skipped if it names it, when the theme has none), AMO_PROFILE, AMO_DIR (the profile's
    # directory) and AMO_VARIANT (dark or light: the variant of an app without its own) in its
    # environment. Quote them ("$AMO_WALLPAPER"). Setting the wallpaper stays your command:
    # amontillado only knows which picture belongs to the theme.
    # reload: 'hyprctl hyprpaper reload ,"$AMO_WALLPAPER"'

  # The apps to theme, one entry per app by name; each renders one file into the profile, which the
  # app's own config includes. Every key of an app is optional: {} renders the built-in template of
  # that name. amo theme templates lists the templates.
  apps:
    # An app's keys:
    #   source: Where the template comes from: builtin, tinted, matugen-themes, pywal, url or path.
    #       builtin is shipped and variables-only; tinted (tinted-theming), matugen-themes and pywal
    #       (pywal16) are fetched by amo theme sync, pinned; url is one file you pin; path is your
    #       own file. Default: the first with a template for the app, in the order builtin, tinted,
    #       matugen-themes, pywal.
    #   template: The registry entry within the source, when it has several for the app
    #       (rofi-colors). Default: the app's name.
    #   format: The template's language: mustache, matugen or pywal. Default: the source's; required
    #       for url and path.
    #   url: For source url: the template at a commit URL (https://). Pinned, since some outputs are
    #       code that runs at every theme switch (a Lua file, a sourced shell file).
    #   sha256: For source url: the file's SHA-256, as hex. amo theme sync keeps no file that
    #       differs.
    #   path: For source path: your template file. Not resolved, so a symlink you swap is followed.
    #   output: The file name in the profile directory. Default: the registry's; required for url
    #       and path.
    #   reload: A command run after the swap, as theme.wallpaper.reload, but AMO_VARIANT is this
    #       app's. A failure warns: the app may not be running.
    #   variant: This app's variant, over theme.variant and --variant.
    #   render_with: Who renders a matugen-format template: amontillado or matugen. matugen renders
    #       from the picture with its own colours, not the palette's: the app misses the contrast
    #       adjustments and the named hues, and with a preset palette gets colours of the same
    #       accent hue only. Needs matugen >= 4 at every apply. Default: amontillado.
    #
    # kitty: {reload: "pkill -USR1 kitty"}
    # rofi: {source: tinted}
    # waybar: {template: gtk, output: waybar-colors.css, reload: "pkill -USR2 waybar"}
    # zed: {source: matugen-themes, render_with: matugen}
    # mytool: {source: path, path: ~/mytool.mustache, format: mustache, output: mytool.conf}
    #
    # libadwaita >= 1.6 takes its accent, success, warning and error text from the desktop's
    # colour scheme, not the file: a reload that sets the scheme to the variant keeps it
    # readable (docs/colour-scheme-hooks.md). One of, or no reload to leave the scheme alone:
    # libadwaita:
    #   reload: 'gsettings set org.gnome.desktop.interface color-scheme "prefer-$AMO_VARIANT"'
    #   # reload: 'darkman set "$AMO_VARIANT"'
    #
    # GTK4 only: libadwaita-vars also sets that text and GNOME's palette (--blue-3 ...), for
    # gtk-4.0/gtk.css; libadwaita then serves gtk-3.0 (adw-gtk3) alone:
    # gtk4: {template: libadwaita-vars}
